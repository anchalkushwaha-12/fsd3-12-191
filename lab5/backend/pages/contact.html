<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Product Enquiry</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 80%;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, textarea, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #007BFF;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    .info {
      margin-top: 30px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #007BFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us – Product Enquiry</h1>
    <form id="enquiryForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone">

      <label for="product">Product of Interest:</label>
      <select id="product">
        <option value="">-- Select a Product --</option>
        <option value="Laptop">Laptop</option>
        <option value="Smartphone">Smartphone</option>
        <option value="Accessories">Accessories</option>
      </select>

      <label for="message">Message / Enquiry Details:</label>
      <textarea id="message" rows="5" required></textarea>

      <button type="submit">Send Enquiry</button>
    </form>

    <div class="info">
      <h3>Our Contact Information</h3>
      <p><strong>Email:</strong> support@yourcompany.com</p>
      <p><strong>Phone:</strong> <a href="tel:1800123456">1800-123-456</a></p>
      <p><strong>Address:</strong> 123 Business Park, Ghaziabad, UP, India</p>
      <p><strong>Business Hours:</strong> Mon–Fri: 9 AM – 6 PM</p>
    </div>
  </div>

  <script>
    document.getElementById("enquiryForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Thank you for your enquiry! We will get back to you soon.");
    });
  </script>
</body>
</html>
